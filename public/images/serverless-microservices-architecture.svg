<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1058 795" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Serverless microservices: Client to CloudFront and WAF to API Gateway HTTP API, then auth, order and payment Lambda services each with a DynamoDB table, order publishing events through EventBridge and SQS to payment">
