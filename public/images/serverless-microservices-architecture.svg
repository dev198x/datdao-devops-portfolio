<text x="397" y="604">orders-table</text>
<text x="927" y="604">payments-table</text>
</g>
<g font-size="16" fill="#0F6E56" text-anchor="middle">
<text x="132" y="630">single-table</text>
<text x="397" y="630">single-table</text>
