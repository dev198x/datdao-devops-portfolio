<path d="M1 1L9 5L1 9" fill="none" stroke="#8A8A85" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect width="1058" height="795" fill="#FFFFFF"/>

