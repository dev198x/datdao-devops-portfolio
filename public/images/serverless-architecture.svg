<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 921" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Serverless architecture: Client to API Gateway HTTP API, then auth, order and payment Lambda services with DynamoDB tables. Order calls payment synchronously, payment calls order asynchronously, a failure queue catches failed async invokes, and the PSP sends webhooks back through API Gateway">
