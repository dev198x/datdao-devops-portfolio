<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="ui-monospace, Menlo, monospace" font-size="14">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#0f766e"/>
    </marker>
  </defs>
  <rect width="900" height="360" fill="#f8fafc"/>

  <rect x="20" y="130" width="110" height="60" rx="8" fill="#e2e8f0" stroke="#64748b"/>
