# ============================================================
# Nginx Reverse-Proxy Reference Config
# Covers: rate limiting, CORS, TLS hardening, trusted proxy /
# real IP, upload streaming, and upstream load balancing.
# ============================================================

# ============================================================
# /etc/nginx/nginx.conf (relevant global sections)
# ============================================================

user www-data;
worker_processes auto;              # 1 worker per CPU core
worker_rlimit_nofile 65535;         # increase file descriptor limit for high concurrency

events {
    worker_connections 4096;        # max simultaneous connections per worker
    multi_accept on;
}

http {
    # ---------------------------------------------------------
    # Basic performance / IO settings
    # ---------------------------------------------------------
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;

    # Hide nginx version in headers/error pages (security)
    server_tokens off;

    # ---------------------------------------------------------
    # Logging
    # ---------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" rt=$request_time uct="$upstream_connect_time" '
                     'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ---------------------------------------------------------
    # Client body / upload size limits
    # ---------------------------------------------------------
    client_max_body_size 20m;        # max size of client request body (e.g. file uploads)
    client_body_buffer_size 128k;    # buffer size for reading client request body
    client_header_buffer_size 1k;    # buffer size for client request headers
    large_client_header_buffers 4 8k;
    client_body_timeout 12;          # time to wait for client body to arrive
    client_header_timeout 12;        # time to wait for client header to arrive
    send_timeout 10;                 # time to wait for client to accept a response

    # ---------------------------------------------------------
    # Gzip compression (reduce bandwidth to clients)
    # ---------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;

    # ---------------------------------------------------------
    # Rate limiting zones (define here, apply inside server/location)
    # ---------------------------------------------------------
    # Zone keyed by client IP, 10MB ~ enough for ~160k IPs
    limit_req_zone $binary_remote_addr zone=req_limit_per_ip:10m rate=10r/s;

    # Limit concurrent connections per IP
    limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;

    # Custom zone for login/auth endpoints (stricter)
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=1r/s;

    # ---------------------------------------------------------
    # Trusted proxy / real IP settings
    # (Use when nginx sits behind a load balancer / CDN like Cloudflare, ALB)
    # ---------------------------------------------------------
    # Trust the LB's IP range so X-Forwarded-For is read correctly
    set_real_ip_from 10.0.0.0/8;         # example internal LB subnet
    set_real_ip_from 172.16.0.0/12;
    # set_real_ip_from 173.245.48.0/20;  # example Cloudflare range - add all CF ranges if needed
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;                # walk the X-Forwarded-For chain to find real client IP

    # ---------------------------------------------------------
    # CORS map (reusable, avoids repeating in every location block)
    # Restrict allowed origins explicitly instead of using "*"
    # ---------------------------------------------------------
    map $http_origin $cors_origin {
        default "";
        "https://app.example.com"   $http_origin;
        "https://admin.example.com" $http_origin;
    }

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    include /etc/nginx/conf.d/*.conf;
}

# ============================================================
# /etc/nginx/conf.d/upstream.conf
# ============================================================

upstream backend_api {
    # least_conn balances based on active connections, good for uneven request times
    least_conn;

    server 10.0.1.10:3000 max_fails=3 fail_timeout=30s;
    server 10.0.1.11:3000 max_fails=3 fail_timeout=30s;

    keepalive 64;   # keep connections open to upstream (reduces TCP handshake overhead)
}

# ============================================================
# /etc/nginx/conf.d/reverse-proxy.conf
# ============================================================

# ---------------------------------------------------------
# HTTP -> HTTPS redirect
# ---------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    # ACME challenge for Let's Encrypt renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------
# Main HTTPS reverse proxy server
# ---------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.example.com;

    # -----------------------------------------------------
    # TLS / SSL configuration
    # -----------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;              # disable old/insecure TLS versions
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    ssl_session_cache shared:SSL:10m;           # reuse SSL sessions to reduce handshake cost
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # OCSP stapling (faster cert validation for clients)
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # HSTS: force browsers to always use HTTPS for this domain
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # -----------------------------------------------------
    # Security headers
    # -----------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # -----------------------------------------------------
    # Body/upload size override for this server (optional)
    # -----------------------------------------------------
    client_max_body_size 20m;

    # -----------------------------------------------------
    # Apply per-IP connection limit globally in this server
    # -----------------------------------------------------
    limit_conn conn_limit_per_ip 20;   # max 20 concurrent connections per IP

    # =======================================================
    # Main API location
    # =======================================================
    location / {
        # ---- Rate limiting ----
        # burst allows short traffic spikes above the rate before rejecting
        # nodelay processes burst requests immediately instead of queuing/delaying them
        limit_req zone=req_limit_per_ip burst=20 nodelay;
        limit_req_status 429;              # return 429 Too Many Requests instead of default 503

        # ---- CORS handling ----
        # Preflight (OPTIONS) requests: respond immediately without hitting backend
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
            add_header Access-Control-Max-Age 86400;  # cache preflight result for 1 day
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }

        # Apply CORS headers to actual requests too
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;

        # ---- Proxy settings ----
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";       # required for keepalive to upstream

        # ---- Trusted proxy / forwarded headers ----
        # Pass along real client info to backend for logging/auth/rate-limiting there too
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # ---- Timeouts to upstream ----
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # ---- Buffering ----
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;

        # Don't fail over to next upstream on error/timeout by default
        # (add if you want automatic retry to another backend server)
        # proxy_next_upstream error timeout invalid_header;
    }

    # =======================================================
    # Stricter rate limit on auth endpoints (brute-force protection)
    # =======================================================
    location /auth/login {
        limit_req zone=login_limit burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =======================================================
    # File upload endpoint (larger body size allowed here only)
    # =======================================================
    location /upload {
        client_max_body_size 100m;     # override global limit just for uploads
        client_body_timeout 60s;       # give large uploads more time

        proxy_pass http://backend_api;
        proxy_request_buffering off;   # stream body to upstream instead of buffering whole file in nginx
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =======================================================
    # Health check endpoint - no rate limit, not logged
    # =======================================================
    location /healthz {
        access_log off;
        proxy_pass http://backend_api;
    }

    # Deny access to hidden files (.env, .git, etc.)
    location ~ /\. {
        deny all;
    }
}
